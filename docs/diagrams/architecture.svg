<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1640" viewBox="0 0 1900 1640" role="img" aria-labelledby="title desc">
<title id="title">Azure network — star hub and spoke</title>
<desc id="desc">Production connectivity hub VNet at the center of a star layout. One blue arrow marks the actual peered application spoke. Gray rim and rays are visual context guides, not network links. Subscription outlines preserve ownership.</desc>
<defs><marker id="peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#245b91" /></marker></defs>
<rect width="1900" height="1640" fill="white" />
<g font-family="Arial,Helvetica,sans-serif">
<text x="30" y="31" font-size="12" letter-spacing="1.6" fill="#617084">DOCUMENTED NETWORK · ILLUSTRATED OVERVIEW</text>
<text x="30" y="72" font-size="32" font-weight="700" fill="#172d46">Azure network — star hub and spoke</text>
<circle cx="950" cy="790" r="560" fill="none" stroke="#dde3eb" stroke-width="2.5" />
<path d="M950.0 622.0 L950.0 230.0" fill="none" stroke="#c9d2de" stroke-width="1.5" stroke-dasharray="3 6" />
