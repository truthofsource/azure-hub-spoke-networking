<title id="title">Azure hub and seven spokes - accepted November 16, 2026</title>
<desc id="desc">Wheel centered on the Hub-owned connectivity VNet. Seven direct peering pairs connect application, analytics, recovery, automation, integration, engineering and nonproduction. Color and labels identify subscription ownership. New networks are empty foundations, not running workloads or automatic transit.</desc>
